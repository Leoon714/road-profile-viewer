[project]
name = "road-profile-viewer"
version = "0.1.0"
description = "Interactive 2D road profile viewer with camera ray intersection using Dash and Plotly"
readme = "README.md"
authors = [
    { name = "Leoon.714", email = "leonschulz04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dash>=2.14.0",
    "plotly>=5.18.0",
    "numpy>=1.26.0",
]

[project.scripts]
road-profile-viewer = "road_profile_viewer:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
